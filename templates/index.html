<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to MP3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 YouTube to MP3</h1>
            <p>Paste a playlist or video URL and download all tracks as a ZIP</p>
        </header>

        <div class="url-section">
            <textarea id="urlInput" placeholder="https://music.youtube.com/playlist?list=... or https://www.youtube.com/watch?v=..."></textarea>
            <button id="checkBtn" onclick="checkInfo()">Check</button>
        </div>

        <div id="infoPanel" class="info-panel hidden">
            <div class="info-header">
                <h2 id="infoTitle"></h2>
                <span id="infoSource" class="badge"></span>
            </div>
            <div id="infoDetails" class="info-details"></div>
            <p id="infoDesc" class="info-desc"></p>
        </div>

        <button id="downloadBtn" class="download-btn" onclick="startDownload()" style="display:none">
            <span id="downloadBtnText">Download as ZIP</span>
            <span id="downloadBtnLoader" class="loader hidden"></span>
        </button>

        <div id="progressSection" class="progress-section hidden">
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <p id="progressText" class="progress-text">Starting...</p>
        </div>

        <div id="resultSection" class="result-section hidden">
            <div class="result-icon">✅</div>
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <a id="downloadLink" class="download-link" href="#" download>Download ZIP</a>
            <button id="newDownloadBtn" class="new-btn" onclick="resetPage()">New Download</button>
        </div>

        <div id="errorSection" class="result-section hidden">
            <div class="result-icon">❌</div>
            <h2 id="errorTitle"></h2>
            <p id="errorMessage"></p>
            <button class="new-btn" onclick="resetPage()">Try Again</button>
        </div>

        <div id="pollingSpinner" class="hidden">
            <div class="spinner"></div>
            <p>Processing... please wait</p>
        </div>
    </div>

    <script>
        let currentJobId = null;
        let pollInterval = null;

        async function checkInfo() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            const res = await fetch('/api/info', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            const data = await res.json();

            if (data.error) {
                showError('Could not fetch info', data.error);
                return;
            }

            document.getElementById('infoTitle').textContent = data.title;
            document.getElementById('infoSource').textContent = data.source || '';

            let details = '';
            if (data.channel) details += `<div><span class="label">Channel:</span> ${data.channel}</div>`;
            if (data.upload_date) details += `<div><span class="label">Upload:</span> ${data.upload_date}</div>`;
            if (data.duration) details += `<div><span class="label">Duration:</span> ${formatDuration(data.duration)}</div>`;
            if (data.view_count) details += `<div><span class="label">Views:</span> ${formatNumber(data.view_count)}</div>`;
            if (data.like_count) details += `<div><span class="label">Likes:</span> ${formatNumber(data.like_count)}</div>`;
            if (data.comment_count) details += `<div><span class="label">Comments:</span> ${formatNumber(data.comment_count)}</div>`;
            if (data.category) details += `<div><span class="label">Category:</span> ${data.category}</div>`;
            if (data.tags && data.tags.length) details += `<div><span class="label">Tags:</span> ${data.tags.slice(0,5).join(', ')}</div>`;
            document.getElementById('infoDetails').innerHTML = details;

            const desc = data.description || '';
            document.getElementById('infoDesc').textContent = desc ? desc.substring(0, 300) + (desc.length > 300 ? '...' : '') : '';

            document.getElementById('infoPanel').classList.remove('hidden');
            document.getElementById('downloadBtn').style.display = 'block';
        }

        async function startDownload() {
            const url = document.getElementById('urlInput').value.trim();
            if (!url) return;

            const btn = document.getElementById('downloadBtn');
            btn.style.display = 'none';
            document.getElementById('downloadBtnLoader').classList.remove('hidden');
            document.getElementById('progressSection').classList.remove('hidden');
            document.getElementById('infoPanel').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');

            const res = await fetch('/api/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({url})
            });
            const data = await res.json();

            if (data.error) {
                showError('Download failed', data.error);
                return;
            }

            currentJobId = data.job_id;
            pollJob();
        }

        function pollJob() {
            pollInterval = setInterval(async () => {
                const res = await fetch(`/api/status/${currentJobId}`);
                const data = await res.json();

                document.getElementById('progressBar').style.width = data.progress + '%';
                document.getElementById('progressText').textContent = data.message || 'Processing...';

                if (data.status === 'complete') {
                    clearInterval(pollInterval);
                    document.getElementById('downloadLink').href = `/api/download/${currentJobId}`;
                    document.getElementById('resultTitle').textContent = 'Done!';
                    document.getElementById('resultMessage').textContent = data.message || 'All tracks zipped.';
                    document.getElementById('progressSection').classList.add('hidden');
                    document.getElementById('resultSection').classList.remove('hidden');
                } else if (data.status === 'failed') {
                    clearInterval(pollInterval);
                    document.getElementById('progressSection').classList.add('hidden');
                    showError('Download failed', data.message || 'Unknown error');
                }
            }, 2000);
        }

        function showError(title, message) {
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('errorSection').classList.remove('hidden');
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMessage').textContent = message;
        }

        function resetPage() {
            if (pollInterval) clearInterval(pollInterval);
            if (currentJobId) fetch(`/api/cleanup/${currentJobId}`, {method: 'DELETE'}).catch(() => {});
            currentJobId = null;
            document.getElementById('urlInput').value = '';
            document.getElementById('infoPanel').classList.add('hidden');
            document.getElementById('downloadBtn').style.display = 'none';
            document.getElementById('downloadBtnLoader').classList.add('hidden');
            document.getElementById('progressSection').classList.add('hidden');
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('progressBar').style.width = '0%';
        }

        function formatNumber(n) {
            if (!n) return '0';
            n = Math.floor(n);
            if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
            if (n >= 1000) return (n/1000).toFixed(1) + 'K';
            return n.toString();
        }

        function formatDuration(seconds) {
            if (!seconds) return 'N/A';
            const s = Math.floor(seconds);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            return `${m}:${String(s%60).padStart(2,'0')}`;
        }
    </script>
</body>
</html>
